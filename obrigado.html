color:#f8fafc!important;color:#0f172a!important;--bg-dark:#f8fafc;--bg-darker:#f1f5f9;--bg-card:#fff;--bg-card-hover:#f8fafc;--border-light:rgba(15,23,42,0.09);--text-main:#0f172a;--text-muted:#475569;--text-dim:#64748b;--primary-text:#1e40af;--grad-text:linear-gradient(135deg,#0f172a 20%,#2563eb 100%)}.thanks-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:3rem 2.5rem;max-width:560px;width:100%;box-shadow:var(--shadow-lg)}.thanks-icon{font-size:3.5rem;color:#34d399;margin-bottom:1rem}.thanks-card h1{font-size:1.75rem;margin-bottom:.75rem}.thanks-card p{color:var(--text-muted);font-size:1rem;line-height:1.6;margin-bottom:1.5rem}.thanks-card .btn{display:inline-flex;align-items:center;gap:.5rem}.redirect-info{margin-top:1.5rem;font-size:.8rem;color:var(--text-dim)}.redirect-info a{color:var(--primary-text);text-decoration:underline}@media(max-width:480px){.thanks-card{padding:2rem 1.5rem}}
  </style>

  <script>(function(){try{var s=localStorage.getItem('demo_niche_theme'),T={tech:{primary:'#2563eb',accent:'#0ea5e9',gradPrimary:'linear-gradient(135deg,#2563eb 0%,#0ea5e9 100%)',gradText:'linear-gradient(135deg,#ffffff 30%,#93c5fd 60%,#38bdf8 100%)',glow:'rgba(37,99,235,0.35)',primaryText:'#60a5fa'},health:{primary:'#10b981',accent:'#06b6d4',gradPrimary:'linear-gradient(135deg,#10b981 0%,#06b6d4 100%)',gradText:'linear-gradient(135deg,#ffffff 30%,#a7f3d0 60%,#34d399 100%)',glow:'rgba(16,185,129,0.35)',primaryText:'#34d399'},beauty:{primary:'#7c3aed',accent:'#a855f7',gradPrimary:'linear-gradient(135deg,#7c3aed 0%,#a855f7 100%)',gradText:'linear-gradient(135deg,#ffffff 30%,#d8b4fe 60%,#c084fc 100%)',glow:'rgba(124,58,237,0.35)',primaryText:'#a78bfa'},gourmet:{primary:'#ef4444',accent:'#f43f5e',gradPrimary:'linear-gradient(135deg,#ef4444 0%,#f43f5e 100%)',gradText:'linear-gradient(135deg,#ffffff 30%,#fecdd3 60%,#f87171 100%)',glow:'rgba(239,68,68,0.35)',primaryText:'#f87171'},fitness:{primary:'#06b6d4',accent:'#3b82f6',gradPrimary:'linear-gradient(135deg,#06b6d4 0%,#3b82f6 100%)',gradText:'linear-gradient(135deg,#ffffff 30%,#bae6fd 60%,#38bdf8 100%)',glow:'rgba(6,182,212,0.35)',primaryText:'#22d3ee'},law:{primary:'#eab308',accent:'#ca8a04',gradPrimary:'linear-gradient(135deg,#eab308 0%,#ca8a04 100%)',gradText:'linear-gradient(135deg,#ffffff 30%,#fef08a 60%,#eab308 100%)',glow:'rgba(234,179,8,0.35)',primaryText:'#facc15'}},t=s&&T[s];if(t){var r=document.documentElement;r.style.setProperty('--primary',t.primary);r.style.setProperty('--primary-text',t.primaryText);r.style.setProperty('--accent',t.accent);r.style.setProperty('--grad-primary',t.gradPrimary);r.style.setProperty('--grad-text',t.gradText);r.style.setProperty('--primary-glow',t.glow)}}catch(e){}})();</script>

<script>(function(){try{if(localStorage.getItem('theme-mode')==='light'||(!localStorage.getItem('theme-mode')&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches))document.body.classList.add('light-mode')}catch(e){}})();</script>
  <div class="thanks-card">
    <div class="thanks-icon"><i class="fa-solid fa-circle-check"></i></div>
    <h1 class="text-gradient">Obrigado pelo Contato!</h1>
    <p>
      Recebemos sua mensagem com sucesso. Nossa equipe entrará em contato 
      o mais breve possível pelo WhatsApp ou e-mail informado.
    </p>
    <a href="index.html" class="btn btn-primary btn-shine">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Voltar para o Site</span>
    </a>
    <div class="redirect-info">
      <i class="fa-solid fa-arrow-up-right-from-square" style="margin-right: 4px;"></i>
      Você será redirecionado automaticamente em <span id="countdown">5</span> segundos.
    </div>
  </div>

  <script defer src="js/bundle.js"></script>
  <script>
    // ─── REDIRECIONAMENTO AUTOMÁTICO ─────────────────────────────────────
    let seconds = 5;
    const countEl = document.getElementById('countdown');
    const timer = setInterval(() => {
      seconds--;
      if (countEl) countEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = 'index.html';
      }
    }, 1000);

    // ─── EVENTOS DE TRACKING ─────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
      const cfg = window.SITE_CONFIG;
      if (typeof gtag === 'function' && cfg?.analytics?.googleAdsConversionId) {
        gtag('event', 'conversion', { send_to: cfg.analytics.googleAdsConversionId });
      }
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
      }
    });
  </script>
</body>
