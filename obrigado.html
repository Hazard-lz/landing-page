  <style>
    :root{--primary:#7c3aed;--primary-hover:#6d28d9;--primary-glow:rgba(124,58,237,0.35);--primary-text:#a78bfa;--accent:#a855f7;--accent-hover:#9333ea;--accent-glow:rgba(168,85,247,0.35);--grad-primary:linear-gradient(135deg,#7c3aed 0%,#a855f7 100%);--grad-primary-hover:linear-gradient(135deg,#6d28d9 0%,#9333ea 100%);--grad-text:linear-gradient(135deg,#ffffff 30%,#d8b4fe 60%,#c084fc 100%);--grad-dark-card:linear-gradient(145deg,rgba(255,255,255,0.05)0%,rgba(255,255,255,0.01)100%);--grad-glow:radial-gradient(circle,rgba(124,58,237,0.18)0%,rgba(168,85,247,0.1)50%,transparent 70%);--bg-dark:#0b0f19;--bg-darker:#060911;--bg-card:rgba(17,24,39,0.7);--bg-card-hover:rgba(31,41,55,0.8);--border-light:rgba(255,255,255,0.08);--border-active:rgba(124,58,237,0.5);--font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,sans-serif;--text-main:#f9fafb;--text-muted:#9ca3af;--text-dim:#6b7280;--radius-sm:8px;--radius-md:14px;--radius-lg:24px;--radius-full:9999px;--shadow-sm:0 4px 6px -1px rgba(0,0,0,0.3);--shadow-md:0 10px 25px -5px rgba(0,0,0,0.4),0 8px 10px -6px rgba(0,0,0,0.3);--shadow-lg:0 20px 40px -15px rgba(0,0,0,0.6);--shadow-glow:0 0 30px rgba(124,58,237,0.3);--transit-fast:0.2s cubic-bezier(0.4,0,0.2,1);--transit-normal:0.35s cubic-bezier(0.4,0,0.2,1);--transit-slow:0.6s cubic-bezier(0.16,1,0.3,1)}*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;max-width:100%;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth;font-size:16px;overflow-x:hidden;max-width:100vw}body{background-color:var(--bg-dark);color:var(--text-main);font-family:var(--font-family);line-height:1.6;overflow-x:hidden;position:relative;width:100%;max-width:100vw;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none}img,svg{max-width:100%;height:auto;display:block}body.light-mode{background-color:#f8fafc!important;color:#0f172a!important;--bg-dark:#f8fafc;--bg-darker:#f1f5f9;--bg-card:#fff;--bg-card-hover:#f8fafc;--border-light:rgba(15,23,42,0.09);--text-main:#0f172a;--text-muted:#475569;--text-dim:#64748b;--primary-text:#1e40af;--grad-text:linear-gradient(135deg,#0f172a 20%,#2563eb 100%)}.thanks-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:3rem 2.5rem;max-width:560px;width:100%;box-shadow:var(--shadow-lg)}.thanks-icon{font-size:3.5rem;color:#34d399;margin-bottom:1rem}.thanks-card h1{font-size:1.75rem;margin-bottom:.75rem}.thanks-card p{color:var(--text-muted);font-size:1rem;line-height:1.6;margin-bottom:1.5rem}.thanks-card .btn{display:inline-flex;align-items:center;gap:.5rem}.redirect-info{margin-top:1.5rem;font-size:.8rem;color:var(--text-dim)}.redirect-info a{color:var(--primary-text);text-decoration:underline}@media(max-width:480px){.thanks-card{padding:2rem 1.5rem}}

  <link rel="stylesheet" href="css/components.css">

</head>
<body>
  <div class="thanks-card">
    <div class="thanks-icon"><i class="fa-solid fa-circle-check"></i></div>
    <h1 class="text-gradient">Obrigado pelo Contato!</h1>
    <p>
      Recebi sua mensagem com sucesso. Entrarei em contato 
      o mais breve possível pelo WhatsApp ou e-mail informado.
    </p>
    <a href="index.html" class="btn btn-primary btn-shine">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Voltar para o Site</span>
    </a>
    <div class="redirect-info">
      <i class="fa-solid fa-arrow-up-right-from-square" style="margin-right: 4px;"></i>
      Você será redirecionado automaticamente em <span id="countdown">5</span> segundos.
    </div>
  </div>

  <script defer src="js/bundle.js"></script>
  <script>
    // ─── REDIRECIONAMENTO AUTOMÁTICO ─────────────────────────────────────
    let seconds = 5;
    const countEl = document.getElementById('countdown');
    const timer = setInterval(() => {
      seconds--;
      if (countEl) countEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = 'index.html';
      }
    }, 1000);

    // ─── EVENTOS DE TRACKING ─────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
      const cfg = window.SITE_CONFIG;
      if (typeof gtag === 'function' && cfg?.analytics?.googleAdsConversionId) {
        gtag('event', 'conversion', { send_to: cfg.analytics.googleAdsConversionId });
      }
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
      }
    });
  </script>
</body>
