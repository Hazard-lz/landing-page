<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="purple-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Purple Glow Background -->
  <circle cx="400" cy="300" r="250" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="180" fill="#a855f7" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="400" r="150" fill="#c084fc" opacity="0.06" filter="url(#glow)"/>

  <!-- Laptop Base -->
  <rect x="180" y="380" width="440" height="20" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="220" y="400" width="360" height="12" rx="6" fill="#0f172a"/>

  <!-- Laptop Screen -->
  <rect x="150" y="120" width="500" height="280" rx="16" fill="url(#screen-grad)" stroke="url(#purple-grad)" stroke-width="2" filter="url(#glow-soft)"/>

  <!-- Screen Content - Browser Bar -->
  <rect x="170" y="140" width="460" height="35" rx="8" fill="rgba(255,255,255,0.05)"/>
  <circle cx="190" cy="157" r="5" fill="#ef4444"/>
  <circle cx="208" cy="157" r="5" fill="#eab308"/>
  <circle cx="226" cy="157" r="5" fill="#22c55e"/>
  <rect x="250" y="150" width="200" height="14" rx="7" fill="rgba(255,255,255,0.08)"/>

  <!-- Code Lines -->
  <rect x="180" y="195" width="120" height="8" rx="4" fill="#a855f7" opacity="0.7"/>
  <rect x="180" y="215" width="200" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="200" y="235" width="160" height="8" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="200" y="255" width="180" height="8" rx="4" fill="#7c3aed" opacity="0.5"/>
  <rect x="180" y="275" width="140" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="200" y="295" width="220" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="180" y="315" width="100" height="8" rx="4" fill="#a855f7" opacity="0.6"/>

  <!-- Right Side - Preview Panel -->
  <rect x="420" y="195" width="190" height="130" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="435" y="210" width="160" height="14" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="435" y="235" width="60" height="60" rx="8" fill="#7c3aed" opacity="0.3"/>
  <rect x="505" y="235" width="90" height="14" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="505" y="255" width="70" height="10" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="435" y="305" width="160" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>

  <!-- Floating Elements -->
  <g filter="url(#glow-soft)">
    <rect x="90" y="250" width="70" height="70" rx="16" fill="#7c3aed" opacity="0.9"/>
    <text x="125" y="290" text-anchor="middle" fill="white" font-size="24" font-family="sans-serif">&lt;/&gt;</text>
  </g>

  <g filter="url(#glow-soft)">
    <rect x="640" y="200" width="70" height="70" rx="16" fill="#a855f7" opacity="0.9"/>
    <text x="675" y="240" text-anchor="middle" fill="white" font-size="22" font-family="sans-serif">{ }</text>
  </g>

  <!-- Bottom Stats Bar -->
  <rect x="170" y="345" width="460" height="35" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="185" y="355" width="80" height="14" rx="4" fill="#a855f7" opacity="0.5"/>
  <rect x="285" y="355" width="100" height="14" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="405" y="355" width="70" height="14" rx="4" fill="rgba(255,255,255,0.06)"/>
  <circle cx="520" cy="362" r="6" fill="#7c3aed" opacity="0.6"/>
  <circle cx="540" cy="362" r="6" fill="#a855f7" opacity="0.4"/>
  <circle cx="560" cy="362" r="6" fill="#c084fc" opacity="0.3"/>
  <rect x="580" y="355" width="35" height="14" rx="4" fill="#22c55e" opacity="0.5"/>

  <!-- Small Decorative Dots -->
  <circle cx="100" cy="420" r="4" fill="#7c3aed" opacity="0.3"/>
  <circle cx="700" cy="150" r="3" fill="#a855f7" opacity="0.4"/>
  <circle cx="680" cy="480" r="5" fill="#c084fc" opacity="0.2"/>
  <circle cx="120" cy="350" r="3" fill="#a855f7" opacity="0.3"/>
  <circle cx="680" cy="350" r="4" fill="#7c3aed" opacity="0.25"/>
</svg>